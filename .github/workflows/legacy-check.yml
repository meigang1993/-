name: Verify Legacy Clone Health
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false, persist-credentials: true }

      - name: Clone legacy repo WITH git-lfs enabled
        run: |
          {
            echo "===== CLONE WITH LFS (the previously broken case) ====="
            git lfs install
            rm -rf /tmp/legacy
            git clone -b "魅魔杀" https://github.com/meigang1993/- /tmp/legacy
            echo "clone_exit=$?   (0 = healthy)"
            cd /tmp/legacy
            git lfs pull
            echo "lfs_pull_exit=$?"
            echo
            echo "===== TOP LEVEL ====="
            ls -1 | head -30
            echo
            echo "===== POINTER LEFTOVER SCAN ====="
            found=0
            while IFS= read -r f; do
              if head -c 40 "$f" | grep -q git-lfs; then echo "POINTER: $f"; found=1; fi
            done < <(find . -type f -not -path './.git/*' -size -1k)
            [ "$found" = "0" ] && echo "no pointer files -> clean"
            echo
            echo "===== SIZE ====="
            du -sh --exclude=.git .
          } 2>&1 | tee /tmp/legacy.log

      - name: Publish log
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B legacy-check
          mkdir -p .github
          cp /tmp/legacy.log .github/legacy.log
          git add -f .github/legacy.log
          git commit -m "chore: legacy clone health log" || exit 0
          git push -f origin legacy-check
