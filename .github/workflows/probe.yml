name: egress-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe yb.woa.com
        run: |
          echo "=== DNS ==="
          getent hosts yb.woa.com || echo "DNS FAIL"
          echo "=== HTTP ==="
          curl -sS -o /tmp/p.bin -w "http=%{http_code} size=%{size_download} time=%{time_total}\n" --max-time 20 "http://yb.woa.com/25n8hDBOwls" || echo "CURL FAILED exit=$?"
          echo "=== HEAD bytes ==="
          head -c 16 /tmp/p.bin | xxd | head -2 || true
